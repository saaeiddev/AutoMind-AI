name: Build AutoMind AI 0.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build and test Windows installer
        shell: powershell
        run: .\scripts\build_windows.ps1 -SkipInstallTest

      - name: Stage release 0.2.0
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release\0.2.0" | Out-Null
          Copy-Item "dist\AutoMindAI.exe" "release\0.2.0\AutoMindAI.exe" -Force
          Copy-Item "dist\installer\AutoMindAI-Setup.exe" "release\0.2.0\AutoMindAI-Setup.exe" -Force
          Copy-Item "dist\SHA256SUMS.txt" "release\0.2.0\SHA256SUMS.txt" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AutoMindAI-Windows-0.2.0
          path: |
            dist/AutoMindAI.exe
            dist/installer/AutoMindAI-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit tested release binaries
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/0.2.0
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add AutoMind AI 0.2.0 Windows release"
            git push
          }
