name: Import and Build AutoMind AI
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download source archive parts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path _parts | Out-Null
          0..61 | ForEach-Object {
            $n = $_.ToString("00")
            $url = "https://raw.githubusercontent.com/saaeiddev/saaeiddev/automind-ci-0.1.0/automind_ci/part$n"
            Invoke-WebRequest -Uri $url -OutFile "_parts/part$n"
          }

      - name: Reassemble and import source
        shell: powershell
        run: |
          $parts = Get-ChildItem _parts\part* | Sort-Object Name
          $zip = Join-Path $PWD "AutoMindAI-Source-0.1.0.zip"
          $stream = [System.IO.File]::Open($zip,[System.IO.FileMode]::Create)
          try {
            foreach ($p in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
              $stream.Write($bytes,0,$bytes.Length)
            }
          } finally { $stream.Dispose() }
          Expand-Archive $zip -DestinationPath _import -Force
          if (-not (Test-Path "_import\AutoMindAI\main.py")) { throw "Source import failed." }
          Get-ChildItem "_import\AutoMindAI" -Force | ForEach-Object {
            if ($_.Name -ne ".git") { Copy-Item $_.FullName -Destination $PWD -Recurse -Force }
          }
          Remove-Item _parts,_import -Recurse -Force
          Remove-Item $zip -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows package
        shell: powershell
        run: .\scripts\build_windows.ps1 -SkipInstallTest

      - name: Validate packaged executable
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist\AutoMindAI.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged self-test failed." }

      - name: Validate installer
        shell: powershell
        run: |
          $installer = Join-Path $PWD "dist\installer\AutoMindAI-Setup.exe"
          $testDir = Join-Path $env:RUNNER_TEMP "AutoMindAI-Test"
          Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$testDir") -Wait
          $installed = Join-Path $testDir "AutoMindAI.exe"
          if (-not (Test-Path $installed)) { throw "Installed executable missing." }
          $p = Start-Process -FilePath $installed -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed self-test failed." }
          $unins = Join-Path $testDir "unins000.exe"
          Start-Process -FilePath $unins -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait

      - name: Add release binaries to repository
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release\0.1.0" | Out-Null
          Copy-Item "dist\AutoMindAI.exe" "release\0.1.0\AutoMindAI.exe" -Force
          Copy-Item "dist\installer\AutoMindAI-Setup.exe" "release\0.1.0\AutoMindAI-Setup.exe" -Force
          Copy-Item "dist\SHA256SUMS.txt" "release\0.1.0\SHA256SUMS.txt" -Force

      - name: Commit complete project
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete AutoMind AI source and Windows release"
          git push
